spring:
  application:
    name: restaurant-admin
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55478}/${DB_NAME:restaurant_admin}
    username: ${DB_USER:restaurant_app}
    password: ${DB_PASSWORD:local_demo_only}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55478}/${DB_NAME:restaurant_admin}
    user: ${DB_USER:restaurant_app}
    password: ${DB_PASSWORD:local_demo_only}
    locations: classpath:db/migration
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  orders:
    # Ventana en la que COCINA puede deshacer su propio último avance (ISO-8601).
    kitchen-undo-window: ${KITCHEN_UNDO_WINDOW:PT2M}
