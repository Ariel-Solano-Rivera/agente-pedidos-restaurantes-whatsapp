services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_admin}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55478}:5432"]
    volumes: ["restaurant_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-restaurant_admin}
      DB_USER: ${POSTGRES_USER:-restaurant_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]
volumes:
  restaurant_data:
